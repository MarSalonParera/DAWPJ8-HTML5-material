<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <input type="range" id="r" min="0" max="255" value="0"><br>
    <input type="range" id="g" min="0" max="255" value="0"><br>
    <input type="range" id="b" min="0" max="255" value="0"><br>

    <script>

        function canviarColor() {
            let vermell = document.getElementById('r').value;
            console.log(vermell);
            let verd = document.getElementById('g').value;
            console.log(verd);
            let blau = document.getElementById('b').value;
            console.log(blau);
            document.body.style.backgroundColor = `rgb(${vermell},${verd}, ${blau})`;
        }
        document.getElementById('r').addEventListener('change', canviarColor);
        document.getElementById('g').addEventListener('change', canviarColor);
        document.getElementById('b').addEventListener('change', canviarColor);
    </script>
</body>

</html>
